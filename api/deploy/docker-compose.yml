# Local run of the API with its own MongoDB: docker compose up --build
# For ZimaOS, use the app store entry instead (it reuses the host MongoDB).
name: family-app
services:
  api:
    build: ..
    ports:
      - "8100:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: family-app
    # Secrets (APNs keys, Radarr, Sonarr, Prowlarr) go in ./data/settings.json,
    # see settings.example.json. Without the file, push and media tools are off.
    volumes:
      - ./data:/data:ro
    depends_on:
      - mongo
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
