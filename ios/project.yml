# XcodeGen manifest: the source of truth for the Xcode project.
# FamilyApp.xcodeproj is generated from this file and is NOT committed.
# Regenerate with: xcodegen generate
#
# Signing (team, bundle id) is never committed: see Config/Signing/README.md.

name: FamilyApp

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  FamilyApp:
    type: application
    platform: iOS
    sources:
      - path: FamilyApp
    settings:
      base:
        # APP_BUNDLE_ID and DEVELOPMENT_TEAM come from Config/Base.xcconfig and
        # the local signing profile.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: FamilyApp
        INFOPLIST_FILE: FamilyApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FamilyApp/Resources/FamilyApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  FamilyApp:
    build:
      targets:
        FamilyApp: all
    run:
      config: Debug
    archive:
      config: Release
