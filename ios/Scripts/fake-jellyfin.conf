# A fake Jellyfin for the UI tests (nginx, see ui-test.sh). It answers the few
# read calls the API makes, with a tiny library:
# - "Arrival" (2016), not played: the watchlist title of the test gets the
#   "On Jellyfin" badge;
# - "Heat" (1995), played: the sync imports it as Watched.
server {
    listen 8096;
    default_type application/json;

    location = /System/Info {
        return 200 '{"Version":"10.0.0-uitest"}';
    }

    location = /Users {
        return 200 '[{"Id":"uitest-user","Name":"Family"}]';
    }

    location = /Items {
        # Played episodes (used for the date of played shows): none.
        if ($arg_IncludeItemTypes = "Episode") {
            return 200 '{"Items":[],"TotalRecordCount":0}';
        }
        return 200 '{"Items":[{"Id":"jf-arrival","Name":"Arrival","Type":"Movie","ProductionYear":2016,"ProviderIds":{"Tmdb":"329865"},"UserData":{"Played":false}},{"Id":"jf-heat","Name":"Heat","Type":"Movie","ProductionYear":1995,"ProviderIds":{"Tmdb":"949"},"UserData":{"Played":true,"LastPlayedDate":"2025-03-22T20:00:00Z"}}],"TotalRecordCount":2}';
    }

    location / {
        return 404 '{}';
    }
}
